{% extends "base.html" %}
{% block content %}
<h2>New event</h2>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" action="/admin/events/new">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="row g-3">
    <div class="col-12 col-md-8"><label class="form-label">Title</label>
      <input name="title" class="form-control" value="{{ f.get('title', '') }}" required></div>
    <div class="col-12 col-md-4"><label class="form-label">Category</label>
      <select name="category" class="form-select">
        {% for c in categories %}<option {% if c == f.get('category') %}selected{% endif %}>{{ c }}</option>{% endfor %}
      </select></div>
    <div class="col-12 col-md-4"><label class="form-label">Venue</label>
      <select name="venue_id" class="form-select">
        {% for v in venues %}<option value="{{ v.id }}" {% if f.get('venue_id') == v.id %}selected{% endif %}>{{ v.name }} (capacity {{ v.capacity }})</option>{% endfor %}
      </select></div>
    <div class="col-6 col-md-4"><label class="form-label">Start</label>
      <input type="datetime-local" name="start" class="form-control" value="{{ f.get('start', '') }}" required></div>
    <div class="col-6 col-md-4"><label class="form-label">End</label>
      <input type="datetime-local" name="end" class="form-control" value="{{ f.get('end', '') }}" required></div>
    <div class="col-12"><label class="form-label">Description</label>
      <textarea name="description" rows="3" class="form-control">{{ f.get('description', '') }}</textarea></div>
  </div>

  <h5 class="mt-4">Ticket categories (fill at least one row)</h5>
  {% for i in range(3) %}
  {% set r = rows[i] if rows|length > i else {} %}
  <div class="row g-2 mb-2">
    <div class="col-12 col-md-5"><input name="cat_name" class="form-control" placeholder="Name, e.g. General" value="{{ r.get('name', '') }}" {% if i == 0 %}required{% endif %}></div>
    <div class="col-6 col-md-3"><input name="cat_price" type="number" step="0.01" min="0" class="form-control" placeholder="Price (LKR)" value="{{ r.get('price', '') }}"></div>
    <div class="col-6 col-md-4"><input name="cat_qty" type="number" min="1" class="form-control" placeholder="Quantity" value="{{ r.get('qty', '') }}"></div>
  </div>
  {% endfor %}

  <div class="mt-3 d-flex gap-2">
    <button name="action" value="draft" class="btn btn-secondary">Save as draft</button>
    <button name="action" value="publish" class="btn btn-success">Publish</button>
  </div>
</form>
{% endblock %}
