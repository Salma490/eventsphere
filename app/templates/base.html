<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventSphere</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">EventSphere</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        {% if user and user.role == 'admin' %}
        <li class="nav-item"><a class="nav-link" href="/admin">Admin</a></li>
        {% endif %}
        {% if user and user.role in ['admin', 'staff'] %}
        <li class="nav-item"><a class="nav-link" href="/scanner">Scanner</a></li>
        {% endif %}
      </ul>
      <div class="d-flex align-items-center gap-2">
        {% if user %}
          <span class="text-white small">{{ user.name }} ({{ user.role }})</span>
          <form method="post" action="/logout" class="m-0">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="btn btn-outline-light btn-sm">Log out</button>
          </form>
        {% else %}
          <a class="btn btn-outline-light btn-sm" href="/login">Log in</a>
          <a class="btn btn-warning btn-sm" href="/register">Register</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
<main class="container py-4">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
