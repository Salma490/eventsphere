{% extends "base.html" %}
{% block content %}
<h1>Welcome to EventSphere</h1>
<p class="lead">Book tickets for university events and hire venues.</p>
{% if user %}
  <p>You are logged in as <strong>{{ user.name }}</strong>.</p>
{% else %}
  <p>Please <a href="/login">log in</a> or <a href="/register">register</a> to continue.</p>
{% endif %}
{% endblock %}
