{% extends "base.html" %}
{% block content %}
<h2>{{ 'Edit venue' if venue else 'New venue' }}</h2>
<form method="post" action="{{ '/admin/venues/' ~ venue.id ~ '/edit' if venue else '/admin/venues/new' }}" class="row g-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="col-12 col-md-6"><label class="form-label">Name</label>
    <input name="name" class="form-control" value="{{ venue.name if venue else '' }}" required></div>
  <div class="col-12 col-md-6"><label class="form-label">Location</label>
    <input name="location" class="form-control" value="{{ venue.location if venue else '' }}" required></div>
  <div class="col-6 col-md-3"><label class="form-label">Capacity</label>
    <input type="number" name="capacity" min="1" class="form-control" value="{{ venue.capacity if venue else '' }}" required></div>
  <div class="col-6 col-md-3"><label class="form-label">Hourly hire rate (LKR)</label>
    <input type="number" step="0.01" min="0" name="hourly_rate" class="form-control" value="{{ venue.hourly_rate if venue else 0 }}"></div>
  <div class="col-12 col-md-6"><label class="form-label">Image URL</label>
    <input name="image_url" class="form-control" placeholder="https://..." value="{{ venue.image_url if venue else '' }}"></div>
  <div class="col-12"><label class="form-label">Description</label>
    <textarea name="description" rows="3" class="form-control">{{ venue.description if venue else '' }}</textarea></div>
  <div class="col-12">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="open_for_hire" value="1" id="hire" {% if venue and venue.open_for_hire %}checked{% endif %}>
      <label class="form-check-label" for="hire">Open for private hire</label>
    </div>
  </div>
  <div class="col-12">
    <button class="btn btn-success">Save venue</button>
    <a href="/admin/venues" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
